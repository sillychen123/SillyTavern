[project]
name = "sillytavern-core"
version = "0.1.0"
description = "Core conversational toolkit for SillyTavern backend services"
authors = [
  { name = "SillyTavern Team" }
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "openai>=1.0.0",
  "streamlit>=1.24.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = [
  "sillytavern_core/tests"
]
